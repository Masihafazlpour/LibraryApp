<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>سامانه مدیریت کتابخانه</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'B Nazanin';
      src: local('B Nazanin'), local('BNazanin'), local('B-Nazanin');
      font-weight: normal; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'B Nazanin';
      src: local('B Nazanin Bold'), local('BNazanin-Bold'), local('B-Nazanin-Bold');
      font-weight: 700; font-style: normal; font-display: swap;
    }
    :root {
      --bg: #0f172a; --bg-grad: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      --panel: #1e293b; --panel-2: #273549; --surface: #334155;
      --accent: #4f46e5; --accent-2: #4338ca;
      --accent-soft: rgba(79, 70, 229, .14);
      --muted: #94a3b8; --text: #e2e8f0; --text-strong: #f8fafc;
      --danger: #dc2626; --danger-soft: rgba(220, 38, 38, .14);
      --success: #16a34a; --success-soft: rgba(22, 163, 74, .14);
      --warning: #d97706;
      --border: rgba(148, 163, 184, .14);
      --border-strong: rgba(148, 163, 184, .24);
      --radius: 8px; --radius-lg: 12px;
      --shadow: 0 1px 2px rgba(0, 0, 0, .24), 0 4px 12px rgba(0, 0, 0, .18);
      --print-bg: #fff;
      color-scheme: dark;
      font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
      font-size: 14px
    }
    :root.light {
      --bg: #f1f5f9; --bg-grad: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      --panel: #fff; --panel-2: #f8fafc; --surface: #f1f5f9;
      --accent: #4338ca; --accent-2: #3730a3;
      --accent-soft: rgba(67, 56, 202, .08);
      --muted: #64748b; --text: #1e293b; --text-strong: #0f172a;
      --border: rgba(15, 23, 42, .09); --border-strong: rgba(15, 23, 42, .16);
      --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 12px rgba(15, 23, 42, .06);
      color-scheme: light
    }
    * { box-sizing: border-box }
    html, body { height: 100%; margin: 0; background: var(--bg-grad); color: var(--text); -webkit-font-smoothing: antialiased; font-family: inherit }
    h1, h2, h3, h4 { font-weight: 700; color: var(--text-strong); margin: 0 }
    .app { max-width: 1320px; margin: 20px auto; border-radius: var(--radius-lg); background: var(--panel); box-shadow: var(--shadow); min-height: 80vh; overflow: hidden; border: 1px solid var(--border) }
    .app-header { padding: 20px 26px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px }
    .logo { width: 54px; height: 54px; border-radius: var(--radius); background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 22px; font-weight: 800; overflow: hidden; flex-shrink: 0 }
    .logo img { width: 100%; height: 100%; object-fit: cover }
    .app-title h1 { font-size: 18px; letter-spacing: -.01em }
    .app-title .subtitle { color: var(--muted); font-size: 12.5px; margin-top: 3px; font-weight: 500 }
    .top-right { margin-right: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
    .user-chip { padding: 6px 14px; border-radius: 20px; background: var(--panel-2); border: 1px solid var(--border); font-size: 12.5px; color: var(--muted); font-weight: 500 }
    nav.tabs { display: flex; gap: 2px; padding: 0 22px; background: var(--panel); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: thin }
    nav.tabs::-webkit-scrollbar { height: 3px }
    nav.tabs::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px }
    nav.tabs button { background: transparent; border: 0; padding: 15px 18px; color: var(--muted); cursor: pointer; font-family: inherit; font-size: 13.5px; font-weight: 500; border-bottom: 2px solid transparent; transition: all .14s; white-space: nowrap }
    nav.tabs button:hover { color: var(--text) }
    nav.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600 }
    .app-body { padding: 24px; display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start }
    .app-body.single-col { grid-template-columns: 1fr }
    @media(max-width:1000px) { .app-body { grid-template-columns: 1fr; padding: 16px } }
    .panel { background: var(--panel-2); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border) }
    .panel-title { font-size: 13px; font-weight: 700; color: var(--text-strong); margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px }
    .panel-title::before { content: ""; width: 3px; height: 14px; background: var(--accent); border-radius: 2px }
    .panel-actions { display: flex; flex-direction: column; gap: 9px }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 15px; border-radius: var(--radius); border: 1px solid transparent; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; transition: all .14s; line-height: 1.2; white-space: nowrap }
    .btn.primary { background: var(--accent); color: #fff }
    .btn.primary:hover { background: var(--accent-2) }
    .btn.ghost { background: transparent; border-color: var(--border-strong); color: var(--text) }
    .btn.ghost:hover { background: var(--panel-2); border-color: var(--muted) }
    .btn.danger { background: var(--danger); color: #fff }
    .btn.danger:hover { background: #b91c1c }
    .btn.success { background: var(--success); color: #fff }
    .btn.success:hover { background: #15803d }
    .btn:disabled { opacity: .5; cursor: not-allowed }
    .btn.sm { padding: 6px 11px; font-size: 12px }
    input[type=text], input[type=number], input[type=password], input[type=time], select, textarea { width: 100%; padding: 10px 13px; border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--panel); color: var(--text); outline: none; font-family: inherit; font-size: 13.5px; transition: border-color .14s; min-width: 0 }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
    select { cursor: pointer }
    input.readonly, input[readonly] { background: var(--panel-2); color: var(--muted); cursor: default }
    .form-row { display: flex; gap: 14px; align-items: center; margin-bottom: 14px }
    .form-row>label { min-width: 130px; text-align: right; font-size: 13px; color: var(--muted); font-weight: 500; flex-shrink: 0 }
    .form-row .field { flex: 1; display: flex; gap: 8px; align-items: center; min-width: 0; overflow: hidden }
    .form-row .field>* { min-width: 0; max-width: 100% }
    @media(max-width:820px) { .form-row { flex-direction: column; align-items: stretch } .form-row>label { min-width: auto; text-align: right; margin-bottom: 4px } }
    .small { font-size: 12.5px; color: var(--muted); font-weight: 500 }
    .muted { color: var(--muted) }
    .list-scroll { overflow: auto; max-height: calc(100vh - 340px); border-radius: var(--radius); border: 1px solid var(--border) }
    .list-scroll table { width: 100%; border-collapse: collapse; font-size: 13px }
    .list-scroll thead th { padding: 12px; text-align: right; font-weight: 600; color: var(--muted); background: var(--panel-2); border-bottom: 1px solid var(--border); font-size: 12px; position: sticky; top: 0; z-index: 1 }
    .list-scroll tbody td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: middle; text-align: right }
    .list-scroll tbody tr:hover { background: var(--accent-soft) }
    .list-scroll tbody tr:last-child td { border-bottom: 0 }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 14px; margin-top: 14px }
    .stat-card { padding: 18px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--border) }
    .stat-card .label { font-size: 12px; color: var(--muted); font-weight: 500 }
    .stat-card .value { font-size: 24px; font-weight: 700; color: var(--text-strong); margin-top: 8px; letter-spacing: -.02em }
    .stat-card.accent { background: var(--accent-soft); border-color: transparent }
    .stat-card.accent .value { color: var(--accent) }
    .stat-card.danger { background: var(--danger-soft); border-color: transparent }
    .stat-card.danger .value { color: var(--danger) }
    #main { min-height: 400px; padding: 0 }
    .form-modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, .75); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 9000; padding: 20px }
    .form-modal-overlay.hidden { display: none }
    .form-modal { background: var(--panel); border-radius: var(--radius-lg); width: 780px; max-width: 100%; max-height: 92vh; display: flex; flex-direction: column; border: 1px solid var(--border-strong); box-shadow: 0 24px 64px rgba(0, 0, 0, .55) }
    .form-modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0 }
    .form-modal-header h3 { font-size: 16px }
    .form-modal-body { padding: 24px; overflow-y: auto; flex: 1 }
    .form-modal-actions { display: flex; gap: 10px; justify-content: flex-end; padding: 18px 24px; border-top: 1px solid var(--border); background: var(--panel-2); flex-shrink: 0 }
    .modal-close { background: transparent; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; padding: 0 4px; font-family: inherit }
    .modal-close:hover { color: var(--text) }
    .dialog-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, .75); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 100000; padding: 20px }
    .dialog-overlay.hidden { display: none }
    .dialog { background: var(--panel); border-radius: var(--radius-lg); width: 440px; max-width: 100%; border: 1px solid var(--border-strong); box-shadow: 0 24px 64px rgba(0, 0, 0, .55); padding: 24px; text-align: center }
    .dialog-icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 26px; font-weight: 800 }
    .dialog-icon.info { background: var(--accent-soft); color: var(--accent) }
    .dialog-icon.warn { background: rgba(217, 119, 6, .14); color: var(--warning) }
    .dialog-icon.danger { background: var(--danger-soft); color: var(--danger) }
    .dialog-icon.success { background: var(--success-soft); color: var(--success) }
    .dialog h3 { font-size: 16px; margin-bottom: 8px }
    .dialog p { font-size: 13.5px; color: var(--muted); line-height: 1.8; margin: 0 0 16px }
    .dialog .dialog-actions { display: flex; gap: 10px; justify-content: center; margin-top: 14px }
    .dialog .dialog-actions .btn { min-width: 100px }
    .dialog input[type=text] { text-align: center; font-family: monospace, monospace; letter-spacing: .1em; font-size: 15px; padding: 12px; text-transform: uppercase }
    .jp-popup { position: fixed; background: var(--panel); border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 14px; width: 280px; box-shadow: 0 16px 48px rgba(0, 0, 0, .55); z-index: 100000 }
    .jp-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; font-weight: 600; color: var(--text-strong) }
    .jp-head button { border: 0; background: transparent; color: var(--text); cursor: pointer; font-size: 18px; padding: 3px 10px; border-radius: var(--radius); font-family: inherit; line-height: 1 }
    .jp-head button:hover { background: var(--panel-2) }
    .jp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px }
    .jp-grid button { border: 0; background: transparent; color: var(--text); padding: 7px 0; border-radius: var(--radius); cursor: pointer; font-size: 12.5px; font-family: inherit; font-weight: 500 }
    .jp-grid button:hover { background: var(--panel-2) }
    .jp-grid button.today { border: 1px solid var(--accent); color: var(--accent) }
    .jp-grid button.selected { background: var(--accent); color: #fff }
    .jp-grid .dow { color: var(--muted); font-size: 11px; text-align: center; padding: 5px 0; font-weight: 600 }
    .tp-popup { position: fixed; background: var(--panel); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: 0 16px 48px rgba(0, 0, 0, .55); z-index: 100000; width: 220px }
    .tp-wrap { display: flex; gap: 1px; padding: 8px }
    .tp-col { flex: 1; min-width: 0 }
    .tp-head { font-size: 11px; color: var(--muted); text-align: center; padding: 4px 0; font-weight: 600 }
    .tp-scroll { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; scrollbar-width: thin }
    .tp-item { padding: 6px 0; border: 0; background: transparent; color: var(--text); cursor: pointer; font-family: inherit; font-size: 13px; border-radius: 6px }
    .tp-item:hover { background: var(--panel-2) }
    .tp-item.selected { background: var(--accent); color: #fff }
    .checkbox { transform: scale(1.15); cursor: pointer; accent-color: var(--accent) }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11.5px; font-weight: 600; white-space: nowrap }
    .badge.success { background: var(--success-soft); color: var(--success) }
    .badge.danger { background: var(--danger-soft); color: var(--danger) }
    .badge.muted { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border) }
    .badge.accent { background: var(--accent-soft); color: var(--accent) }
    .list-manager { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px }
    .list-manager-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; background: var(--panel-2); border-radius: 6px; margin-bottom: 7px; font-size: 13px; border: 1px solid var(--border) }
    .list-manager-item:last-child { margin-bottom: 0 }
    .list-manager-item button { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 3px 10px; border-radius: 4px; font-size: 16px; line-height: 1; font-family: inherit }
    .list-manager-item button:hover { color: var(--danger); background: var(--danger-soft) }
    .list-manager-empty { text-align: center; padding: 22px; color: var(--muted); font-size: 12.5px }
    .pick-list { max-height: 190px; overflow: auto; border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 6px; background: var(--panel) }
    .pick-list-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; border: 1px solid transparent }
    .pick-list-item:hover { background: var(--panel-2) }
    .pick-list-item.selected { background: var(--accent-soft); border-color: var(--accent) }
    .pick-list-item input { accent-color: var(--accent); cursor: pointer; transform: scale(1.1) }
    .pick-list-empty { text-align: center; padding: 16px; color: var(--muted); font-size: 12px }
    .own-book-row { display: flex; gap: 8px; align-items: center }
    .own-book-row input { flex: 1 }
    .own-book-row button { flex-shrink: 0 }
    .toast-wrap { position: fixed; left: 22px; bottom: 22px; z-index: 99999; display: flex; flex-direction: column; gap: 9px }
    .toast { padding: 12px 18px; border-radius: var(--radius); background: #0f172a; color: #fff; opacity: 0; transform: translateY(8px); transition: all .2s; font-size: 13px; box-shadow: 0 8px 24px rgba(0, 0, 0, .35); border-right: 3px solid var(--accent); font-weight: 500 }
    .toast.show { opacity: 1; transform: none }
    #loginModal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(15, 23, 42, .88), rgba(15, 23, 42, .94)); z-index: 999999; backdrop-filter: blur(6px) }
    #loginModal .modalCard { width: 440px; max-width: 94%; background: var(--panel); padding: 36px 32px; border-radius: var(--radius-lg); box-shadow: 0 24px 64px rgba(0, 0, 0, .6); text-align: center; border: 1px solid var(--border-strong) }
    #loginModal h2 { margin: 0 0 8px; font-size: 18px }
    #loginModal .login-logo { width: 64px; height: 64px; border-radius: var(--radius); background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 28px; font-weight: 800; margin: 0 auto 18px }
    #loginModal p { margin: 0 0 20px; color: var(--muted); font-size: 13px; line-height: 1.8 }
    #loginModal input { margin-bottom: 14px; padding: 12px 16px; text-align: center; font-size: 14px }
    #loginModal .actions { display: flex; gap: 10px }
    #loginModal .actions button { flex: 1 }
    #loginModal .note { font-size: 12px; color: var(--muted); margin-top: 16px }
    #loginModal.hidden { display: none }
    .app.hidden { visibility: hidden }
    .section-title { font-size: 15px; font-weight: 700; color: var(--text-strong); margin: 0 0 4px }
    .section-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 16px }
    .hint-box { padding: 14px 16px; background: var(--accent-soft); border-radius: var(--radius); font-size: 12.5px; line-height: 1.9; color: var(--text); border-right: 3px solid var(--accent) }
    .hint-box b { color: var(--text-strong) }
    .filter-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap }
    .filter-bar>* { min-width: 0 }
    .filter-bar input[type=text] { flex: 2; min-width: 180px }
    .filter-bar select { flex: 1; min-width: 120px; max-width: 180px }
    .study-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; padding: 4px }
    .study-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; position: relative; transition: border-color .14s }
    .study-card:hover { border-color: var(--border-strong) }
    .study-card.active { border-right: 3px solid var(--accent) }
    .study-card.ended { border-right: 3px solid var(--muted); opacity: .85 }
    .study-card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px }
    .study-card-name { font-weight: 700; font-size: 14px; color: var(--text-strong) }
    .study-card-time { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12.5px }
    .study-card-time .tcell { padding: 8px 10px; background: var(--panel-2); border-radius: 6px }
    .study-card-time .tlabel { font-size: 10.5px; color: var(--muted); font-weight: 500; display: block; margin-bottom: 3px }
    .study-card-time .tvalue { font-weight: 600; color: var(--text-strong); direction: ltr; text-align: right }
    .study-card-books { font-size: 12.5px; color: var(--text); line-height: 1.7 }
    .study-card-books .bmark { display: inline-block; padding: 2px 8px; background: var(--panel-2); border-radius: 10px; font-size: 11.5px; margin: 2px 2px 2px 0; border: 1px solid var(--border) }
    .study-card-actions { display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 10px; margin-top: auto }
    .print-card { box-sizing: border-box; width: 10cm; height: 6cm; border-radius: 10px; overflow: hidden; position: relative; background: linear-gradient(135deg, #1e293b 0%, #334155 100%); color: #fff; display: flex; flex-direction: column; page-break-inside: avoid; -webkit-print-color-adjust: exact; border: 1px solid rgba(255, 255, 255, .08) }
    .print-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--accent), var(--accent-2)) }
    .print-card .card-inner { display: flex; flex-direction: column; height: 100%; padding: 14px 16px 12px; position: relative; z-index: 1 }
    .print-card .card-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, .12); margin-bottom: 10px }
    .print-card .lib-name { font-weight: 700; font-size: 12.5px; color: #fff }
    .print-card .card-label { font-size: 10px; color: rgba(255, 255, 255, .7); background: rgba(255, 255, 255, .08); padding: 3px 10px; border-radius: 10px; font-weight: 600 }
    .print-card .card-body { display: flex; gap: 14px; flex: 1; align-items: flex-start }
    .print-card .card-info { flex: 1; display: flex; flex-direction: column; gap: 7px }
    .print-card .info-label { font-size: 9.5px; color: rgba(255, 255, 255, .6); font-weight: 500 }
    .print-card .info-value { font-size: 12.5px; font-weight: 600; color: #fff }
    .print-card .code-value { font-size: 15px; font-weight: 800; color: #fff; letter-spacing: .04em; font-family: monospace, monospace }
    .print-card .photo-box { width: 80px; height: 100px; border-radius: 6px; overflow: hidden; background: rgba(255, 255, 255, .1); display: flex; align-items: center; justify-content: center; border: 1.5px solid rgba(255, 255, 255, .2); flex-shrink: 0 }
    .print-card .photo-box img { width: 100%; height: 100%; object-fit: cover }
    .print-card .photo-placeholder { font-size: 9px; color: rgba(255, 255, 255, .5); text-align: center; padding: 6px }
    .print-card .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, .1); margin-top: 8px; font-size: 9px; color: rgba(255, 255, 255, .55) }
    .print-card .accent-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; margin-left: 5px }
    .group-page { width: 210mm; height: 297mm; box-sizing: border-box; padding: 10mm; display: flex; flex-wrap: wrap; background: #fff }
    .group-page .card-wrapper { box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex: 0 0 auto }
    .book-label {
      width: 6.2cm; min-height: 3.2cm; box-sizing: border-box;
      border: 1px dashed #666; border-radius: 6px;
      padding: 8px 10px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px;
      background: #fff; color: #000; page-break-inside: avoid;
      font-family: 'B Nazanin', 'Vazirmatn', sans-serif;
      text-align: center; margin: 2mm;
    }
    .book-label .bl-head { font-size: 10.5px; color: #444; width: 100%; border-bottom: 1px dashed #ccc; padding-bottom: 4px; }
    .book-label .bl-title { font-size: 14px; font-weight: 700; line-height: 1.3; }
    .book-label .bl-meta { font-size: 11px; color: #333; }

      const JP_M = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];

      function attachTimePicker(input) {

        function render() { if (!popup) return; let hh = '00', mm = '00'; const cur = String(input.value || '').trim().match(/^(\d{1,2}):(\d{2})$/); if (cur) { hh = String(cur[1]).padStart(2, '0'); mm = cur[2]; } const hours = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0')); const mins = Array.from({ length: 12 }, (_, i) => String(i * 5).padStart(2, '0')); let selH = hh, selM = mm; popup.innerHTML = `<div class="tp-wrap"><div class="tp-col"><div class="tp-head">ساعت</div><div class="tp-scroll" data-col="h">${hours.map(h => `<button type="button" class="tp-item ${h === hh ? 'selected' : ''}" data-h="${h}">${h}</button>`).join('')}</div></div><div class="tp-col"><div class="tp-head">دقیقه</div><div class="tp-scroll" data-col="m">${mins.map(m => `<button type="button" class="tp-item ${m === mm ? 'selected' : ''}" data-m="${m}">${m}</button>`).join('')}</div></div></div><div style="display:flex;gap:6px;padding:8px;border-top:1px solid var(--border)"><button type="button" class="btn primary sm" style="flex:1" data-act="ok">تایید</button><button type="button" class="btn ghost sm" style="flex:1" data-act="now">اکنون</button></div>`; position(); popup.querySelectorAll('.tp-item[data-h]').forEach(b => b.onclick = e => { e.preventDefault(); selH = b.dataset.h; popup.querySelectorAll('.tp-item[data-h]').forEach(x => x.classList.toggle('selected', x.dataset.h === selH)); }); popup.querySelectorAll('.tp-item[data-m]').forEach(b => b.onclick = e => { e.preventDefault(); selM = b.dataset.m; popup.querySelectorAll('.tp-item[data-m]').forEach(x => x.classList.toggle('selected', x.dataset.m === selM)); }); popup.querySelector('[data-act="ok"]').onclick = e => { e.preventDefault(); input.value = selH + ':' + selM; input.dispatchEvent(new Event('change', { bubbles: true })); close(); }; popup.querySelector('[data-act="now"]').onclick = e => { e.preventDefault(); input.value = nowHM(); input.dispatchEvent(new Event('change', { bubbles: true })); close(); }; const sh = p       /* ================= IndexedDB ================= */

      function openDB() { return new Promise((res, rej) => { const r = indexedDB.open(DB_NAME, DB_VERSION); r.onupgradeneeded = e => { const idb = e.target.result; if (!idb.objectStoreNames.contains('settings')) idb.createObjectStore('settings', { keyPath: 'key' }); if (!idb.objectStoreNames.contains('members')) { const m = idb.createObjectStore('members', { keyPath: 'id', autoIncrement: true }); m.createIndex('membershipCode', 'membershipCode', { unique: true }); } if (!idb.objectStoreNames.contains('books')) { const b = idb.createObjectStore('books', { keyPath: 'id', autoIncrement: true }); b.createIndex('regNumber', 'regNumber', { unique: true }); } if (!idb.objectStoreNames.contains('loans')) { const l = idb.createObjectStore('loans', { keyPath: 'id', autoIncrement: true }); l.createIndex('memberId', 'memberId'); l.createIndex('bookId', 'bookId'); } if (!idb.objectStoreNames.contains('study')) idb.createObjectStore('study', { keyPath: 'id', autoIncrement: true }); }; r.onsuccess = e => { db = e.target.result; res(db); }; r.onerror = e => rej(e); }); }

      /* ================= Utils ================= */
      function escapeHtml(s) { if (!s && s !== 0) return ''; return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

      /* ================= CARD PRINTING ================= */
      async function renderCardTools() {
        panelContent.innerHTML = `<div class="panel-title">تنظیمات چاپ کارت</div><div><div class="form-row"><label>عرض (mm)</label><div class="field"><input id="cardWidth" type="number" min="10" value="85" /></div></div><div class="form-row"><label>ارتفاع (mm)</label><div class="field"><input id="cardHeight" type="number" min="10" value="60" /></div></div><div class="form-row"><label>فاصله بین کارت‌ها</label><div class="field"><input id="cardMargin" type="number" min="0" value="3" /></div></div><div class="form-row"><label>حاشیه صفحه</label><div class="field"><input id="pagePadding" type="number" min="0" value="4" /></div></div><div style="margin-top:14px;display:flex;flex-direction:column;gap:8px"><button id="generateCards" class="btn primary">پیش‌نمایش</button><button id="printCardsBtn" class="btn ghost">چاپ کارت‌ها</button></div></div>`;
        const members = await getMembers();
        main.innerHTML = `<div style="padding:22px"><div class="section-title">انتخاب اعضا</div><div class="section-sub">برای چاپ گروهی، اعضای مورد نظر را انتخاب کنید</div><div style="margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input id="cardSearch" type="text" placeholder="جستجوی عضو..." style="flex:1;min-width:180px" /><button id="selectAll" class="btn ghost sm">انتخاب همه</button><button id="clearAll" class="btn ghost sm">لغو انتخاب</button><button id="toggleSample" class="btn ghost sm">نمونه عکس</button></div><div id="membersSelectArea" style="max-height:420px;overflow:auto;border-radius:8px;padding:12px;background:var(--panel-2);border:1px solid var(--border)"></div><div id="cardsPreview" style="margin-top:16px"></div></div>`;
        const area = document.getElementById('membersSelectArea');
        function renderMC(q = '') { const qv = q.trim().toLowerCase(); const fl = members.filter(m => { if (!qv) return true; return `${m.membershipCode} ${m.firstName} ${m.lastName}`.toLowerCase().includes(qv); }); if (fl.length === 0) { area.innerHTML = '<div class="list-manager-empty">یافت نشد</div>'; return; } area.innerHTML = fl.map(m => `<label style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:6px;cursor:pointer;border:1px solid var(--border);margin-bottom:6px;background:var(--panel)"><input type="checkbox" class="member-ck" value="${m.id}" data-id="${m.id}" /> <span style="flex:1"><b>${escapeHtml(m.firstName)} ${escapeHtml(m.lastName)}</b></span> <span class="badge muted">${escapeHtml(m.membershipCode)}</span></label>`).join(''); }
        renderMC('');
        document.getElementById('cardSearch').addEventListener('input', debounce(e => renderMC(e.target.value), 180));
        document.getElementById('selectAll').addEventListener('click', () => { document.querySelectorAll('#membersSelectArea input.member-ck').forEach(i => i.checked = true); });
        document.getElementById('clearAll').addEventListener('click', () => { document.querySelectorAll('#membersSelectArea input.member-ck').forEach(i => i.checked = false); });
        document.getElementById('toggleSample').addEventListener('click', async () => { const ms = await getMembers(); for (const m of ms) { if (!m.photo) { m.photo = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><rect width="100%" height="100%" fill="#f4f4f4"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="18" fill="#444">عکس</text></svg>`)}`; await idbPut('members', m); } } showToast('نمونه عکس'); dataBus.emit('members'); });
        document.getElementById('generateCards').addEventListener('click', async () => { const chk = Array.from(document.querySelectorAll('#membersSelectArea input.member-ck:checked')).map(n => Number(n.value)); if (chk.length === 0) { await alertDialog('توجه', 'حداقل یک عضو انتخاب کنید', { type: 'warn' }); return; } const sel = (await getMembers()).filter(m => chk.includes(m.id)); generateCardPagesPreview(sel, Number(document.getElementById('cardWidth').value || 85), Number(document.getElementById('cardHeight').value || 60), Number(document.getElementById('cardMargin').value || 3), Number(document.getElementById('pagePadding').value || 4)); });
        document.getElementById('printCardsBtn').addEventListener('click', async () => { const chk = Array.from(document.querySelectorAll('#membersSelectArea input.member-ck:checked')).map(n => Number(n.value)); if (chk.length === 0) { await alertDialog('توجه', 'حداقل یک عضو انتخاب کنید', { type: 'warn' }); return; } const sel = (await getMembers()).filter(m => chk.includes(m.id)); buildPrintPagesForCards(sel, Number(document.getElementById('cardWidth').value || 85), Number(document.getElementById('cardHeight').value || 60), Number(document.getElementById('cardMargin').value || 3), Number(document.getElementById('pagePadding').value || 4)); await new Promise(r => setTimeout(r, 250)); window.print(); setTimeout(() => { printArea.innerHTML = ''; }, 800); });
      }
      function buildCardHTML(m) { const lib = escapeHtml(libNameEl.textContent || ''); const full = escapeHtml((m.firstName || '') + ' ' + (m.lastName || '')); return `<div class="print-card"><div class="card-inner"><div class="card-head"><div class="lib-name">${lib}</div><div class="card-label">کارت عضویت</div></div><div class="card-body"><div class="card-info"><div><div class="info-label">نام و نام خانوادگی</div><div class="info-value">${full}</div></div><div><div class="info-label">کد عضویت</div><div class="code-value">${escapeHtml(m.membershipCode || '')}</div></div><div><div class="info-label">پایه / رشته</div><div class="info-value">${escapeHtml(m.grade || '')}${m.field ? ' — ' + escapeHtml(m.field) : ''}</div></div></div><div class="photo-box">${m.photo ? `<img src="${m.photo}" alt="" />` : '<div class="photo-placeholder">محل الصاق عکس</div>'}</div></div><div class="card-footer"><span>سال تحصیلی جاری</span><span><span class="accent-dot"></span>شناسنامه کتابخانه</span></div></div></div>`; }
      async function printMemberCard(m) { printArea.innerHTML = `<div class="print-page" style="width:210mm;box-sizing:border-box;padding:10mm"><div style="display:flex;align-items:center;justify-content:center;height:100%">${buildCardHTML(m)}</div></div>`; await new Promise(r => setTimeout(r, 200)); window.print(); setTimeout(() => { printArea.innerHTML = ''; }, 600); }
      function generateCardPagesPreview(members, cw, ch, cm, pp) { const preview = document.getElementById('cardsPreview'); preview.innerHTML = ''; const pw = 210, ph = 297, uW = pw - pp * 2, uH = ph - pp * 2, tW = cw + cm * 2, tH = ch + cm * 2; const cols = Math.max(1, Math.floor(uW / tW)), rows = Math.max(1, Math.floor(uH / tH)); const per = cols * rows; const info = document.createElement('div'); info.className = 'small muted'; info.style.marginBottom = '8px'; info.textContent = `${cols} × ${rows} — هر صفحه ${per} کارت — مجموع ${Math.ceil(members.length / per)} صفحه`; preview.appendChild(info); for (let i = 0; i < members.length; i += per) { const chk = members.slice(i, i + per); const p = document.createElement('div'); p.className = 'group-page'; p.style.cssText = `padding:${pp}mm;width:${pw}mm;height:${ph}mm;box-sizing:border-box;background:#fff;border:1px solid var(--border);margin-bottom:12px`; chk.forEach(m => { const w = document.createElement('div'); w.className = 'card-wrapper'; w.style.cssText = `width:${cw}mm;height:${ch}mm;margin:${cm}mm;box-sizing:border-box;flex:0 0 auto`; w.innerHTML = buildCardHTML(m); p.appendChild(w); }); preview.appendChild(p); } }
      function buildPrintPagesForCards(members, cw, ch, cm, pp) { printArea.innerHTML = ''; const pw = 210, ph = 297, uW = pw - pp * 2, uH = ph - pp * 2, tW = cw + cm * 2, tH = ch + cm * 2; const cols = Math.max(1, Math.floor(uW / tW)), rows = Math.max(1, Math.floor(uH / tH)); const per = cols * rows; for (let i = 0; i < members.length; i += per) { const chk = members.slice(i, i + per); const p = document.createElement('div'); p.className = 'group-page'; const more = (i + per) < members.length; p.style.cssText = `width:${pw}mm;height:${ph}mm;box-sizing:border-box;padding:${pp}mm;display:flex;flex-wrap:wrap;align-content:flex-start;background:#fff;${more ? 'page-break-after:always;break-after:page' : ''}`; chk.forEach(m => { const w = document.createElement('div'); w.className = 'card-wrapper'; w.style.cssText = `width:${cw}mm;height:${ch}mm;margin:${cm}mm;box-sizing:border-box;flex:0 0 auto`; w.innerHTML = buildCardHTML(m); p.appendChild(w); }); printArea.appendChild(p); } }

      /* ================= BOOK LABEL PRINT ================= */
      async function buildBookLabelsPrint(books) {
        printArea.innerHTML = '';
        const header = `<div style="text-align:center;margin-bottom:6px"><div style="font-weight:700;font-size:15px">${escapeHtml(libNameEl.textContent || '')}</div><div style="font-size:12px">برچسب کتاب‌ها — ${escapeHtml(nowShamsiFull())}</div></div>`;
        const perPage = 12;
        const totalPages = Math.ceil(books.length / perPage);
        for (let p = 0; p < totalPages; p++) {
          const chunk = books.slice(p * perPage, p * perPage + perPage);
          const page = document.createElement('div');
          page.className = 'print-page';
          page.style.cssText = "width:210mm;box-sizing:border-box;padding:8mm;background:#fff";
          page.innerHTML = header + `<div style="display:flex;flex-wrap:wrap;gap:2mm;justify-content:flex-start">` +
            chunk.map(b => `
              <div class="book-label">
                <div class="bl-head">${escapeHtml(libNameEl.textContent || '')}</div>
                <div class="bl-title">${escapeHtml(b.title || '')}</div>
                <div class="bl-meta">${b.grade ? escapeHtml(b.grade) : ''}${b.field ? ' — ' + escapeHtml(b.field) : ''}</div>
                <div class="bl-code-wrap">${escapeHtml(b.regNumber || '')}</div>
              </div>`).join('') +
            `</div>`;
          printArea.appendChild(page);
        }
        await new Promise(r => setTimeout(r, 300));
        window.print();
        setTimeout(() => { printArea.innerHTML = ''; }, 1000);
      }

      /* ================= SHA-256 ================= */
      async function sha256(msg) { const enc = new TextEncoder(); const h = await crypto.subtle.digest('SHA-256', enc.encode(msg)); return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join(''); }

      window.libApp = { getMembers, getBooks, getLoans, getStudy, buildCardHTML, renewLoan, openFormModal, closeFormModal, performAutosave, confirmDialog, alertDialog, dataBus };

    })();
  </script>
