<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10233f">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests">
  <title>سامانه مدیریت کتابخانه — سمک</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="appShell" class="app-shell is-hidden" aria-hidden="true">
    <header class="app-header no-print">
      <div class="brand">
        <div id="logoEl" class="brand-logo" aria-hidden="true">📚</div>
        <div class="brand-copy">
          <h1 id="libName">سامانه مدیریت کتابخانه</h1>
          <p>مدیریت اعضا، منابع، امانت‌ها و گزارش‌های کتابخانه</p>
        </div>
      </div>
      <div class="header-tools">
        <div class="date-box">
          <strong id="nowShamsi">—</strong>
          <span id="currentUserLabel">—</span>
        </div>
        <button id="themeToggle" class="icon-btn" type="button" title="تغییر پوسته" aria-label="تغییر پوسته">◐</button>
        <button id="logoutBtn" class="btn btn-outline" type="button">خروج</button>
      </div>
    </header>

    <nav id="tabs" class="main-nav no-print" aria-label="منوی اصلی">
      <button class="nav-btn is-active" data-tab="dashboard" type="button">داشبورد</button>
      <button class="nav-btn" data-tab="members" type="button">اعضا</button>
      <button class="nav-btn" data-tab="books" type="button">کتاب‌ها</button>
      <button class="nav-btn" data-tab="loans" type="button">امانات</button>
      <button class="nav-btn" data-tab="reports" type="button">گزارشات</button>
      <button class="nav-btn" data-tab="cards" type="button">چاپ کارت</button>
      <button class="nav-btn admin-only" data-tab="settings" type="button">تنظیمات</button>
    </nav>

    <main class="workspace no-print">
      <aside id="panel" class="panel panel-side">
        <div id="panelContent" class="panel-content">در حال آماده‌سازی…</div>
      </aside>
      <section id="main" class="panel panel-main" aria-live="polite">در حال بارگذاری…</section>
    </main>
  </div>

  <div id="loginModal" class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <form id="loginForm" class="login-card" autocomplete="on">
      <div class="login-mark">سمک</div>
      <h2 id="loginTitle">ورود به سامانه کتابخانه</h2>
      <p>نام کاربری و رمز عبور اختصاصی خود را وارد کنید.</p>
      <label class="field-label" for="loginUsername">نام کاربری</label>
      <input id="loginUsername" name="username" type="text" inputmode="text" autocomplete="username" required maxlength="50">
      <label class="field-label" for="loginPassword">رمز عبور</label>
      <input id="loginPassword" name="password" type="password" autocomplete="current-password" required minlength="8">
      <div id="loginError" class="form-error" role="alert"></div>
      <button id="loginSubmit" class="btn btn-primary btn-block" type="submit">ورود امن</button>
      <small>دسترسی کاربران و اطلاعات توسط پایگاه‌داده و سیاست‌های امنیتی کنترل می‌شود.</small>
    </form>
  </div>

  <div id="toastWrap" class="toast-wrap" aria-live="polite" aria-atomic="true"></div>
  <div id="printArea" class="print-area" aria-hidden="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
